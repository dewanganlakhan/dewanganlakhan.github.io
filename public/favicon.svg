<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Badge -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Ring Accent -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="8" />

  <!-- Monogram "LD" -->
  <text x="88" y="330" fill="url(#textGrad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="220" letter-spacing="-12">LD</text>

  <!-- AI Spark Element (Top Right) -->
  <path d="M 375 90 Q 375 130 415 130 Q 375 130 375 170 Q 375 130 335 130 Q 375 130 375 90 Z" fill="url(#sparkGrad)" filter="url(#glow)" />
</svg>
